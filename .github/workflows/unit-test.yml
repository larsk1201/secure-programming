name: Unit-Testing

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ci-cd
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Check linting with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Test with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew test
