name: Publish

on:
  push:
    branches:
      - feat/ci-cd
  release:
    types:
      - published
      - released
      - prereleased
      - edited
  create:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: Build android package
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Sign app APK
        uses: TeamNecta/build-signed-apk@v2.1
        id: sign_app
        with:
          keystore_b64: ${{ secrets.SIGNING_KEY }}
          key_alias: ${{ secrets.ALIAS }}
          keystore_password: ${{ secrets.KEY_STORE_PASSWORD }}
          java_version: 21
          java_distribution: 'temurin'
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk ~/guineatrade.apk
      - name: Append APK as artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: guineatrade.apk
          path: ~/guineatrade.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
          overwrite: true
      - name: Generate hashes
        run: |
          sha256sum ~/guineatrade.apk >> ~/checksum.txt
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ~/guineatrade.apk
            ~/checksum.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}