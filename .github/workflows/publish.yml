name: Publish

on:
  push:
    branches:
      - feat/ci-cd
  release:
    types:
      - published
      - released
      - prereleased
      - edited
  create:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: Build android package
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Sign app APK
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks
      
          # Manually signing it because Github actions don't work
          jarsigner \
          -verbose \
          -sigalg SHA256withRSA \
          -digestalg SHA-256 \
          -keystore keystore.jks \
          -storepass ${{ secrets.KEY_STORE_PASSWORD }} \
          -signedjar ./app/build/outputs/apk/release/guineatrade-signed.apk \
          ./app/build/outputs/apk/release/app-release-unsigned.apk \
          ${{ secrets.ALIAS }}
      
          # Cleanup
          rm -f keystore.jks
          mv ./app/build/outputs/apk/release/guineatrade-signed.apk ~/guineatrade.apk

      - name: Append APK as artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: guineatrade.apk
          path: ~/guineatrade.apk
          if-no-files-found: error
          retention-days: 30
          archive: false
          overwrite: true
      - name: Generate hashes
        run: |
          sha256sum ~/guineatrade.apk >> ~/checksum.txt
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ~/guineatrade.apk
            ~/checksum.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}